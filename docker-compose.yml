services:
  comicmanager:
    build: .
    container_name: comicmanager
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Usuario/contraseña de acceso a la web (cámbialos si quieres)
      - COMICMGR_USER=${COMICMGR_USER:-alex}
      - COMICMGR_PASS=${COMICMGR_PASS:?Define COMICMGR_PASS en el archivo .env}

      # API key gratuita de ComicVine: https://comicvine.gamespot.com/api/
      - COMICVINE_API_KEY=

      # Credenciales de Whakoom. Defínelas en .env, nunca en este archivo.
      - WHAKOOM_USER=${WHAKOOM_USER:-}
      - WHAKOOM_PASS=${WHAKOOM_PASS:-}

      # Si es "true", al convertir un .cbr a .cbz se borra el .cbr original
      # tras verificar que el .cbz nuevo tiene el mismo nº de páginas.
      # Por defecto lo dejamos en "false": se quedan ambos y decides tú
      # cuándo borrar los .cbr manualmente, para máxima seguridad.
      - COMICMGR_DELETE_CBR_AFTER_CONVERT=false
    volumes:
      # Datos propios de la app: base de datos, portadas, copias de
      # seguridad. Se queda fuera del contenedor para no perder nada al
      # reconstruir la imagen.
      - ./data:/data

      # Biblioteca real en modo solo lectura para evitar cualquier
      # modificación accidental de los ficheros durante la prueba inicial.
      - /mnt/disco/descargas/comics:/comics:ro

      # Cómics pendientes de clasificar/leer desde aMule. Verificado: la
      # carpeta contiene archivos .cbz y .cbr. Añádela en la interfaz como
      # biblioteca con ruta /incoming.
      - /mnt/disco/descargas/Isos/mula/Incoming:/incoming:ro

      # (Opcional) si en algún momento traes tu ComicDb.xml desde el PC
      # para hacer la importación de metadatos, ponlo por ejemplo en
      # ./comicrackce-import/ComicDb.xml y móntalo así:
      - ./comicrackce-import:/comicrackce-import
